<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>She said yes :)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="yes-page">
  <canvas id="confetti"></canvas>

  <main class="page">
    <section class="card success">
      <div class="big-heart">♡</div>
      <p class="eyebrow">OKAY, THIS MADE MY DAY</p>
      <h1>Formal it is :)</h1>

      <p class="message">
        I’m genuinely excited.<br>
        I’ll pick you up, and we’ll go together.
      </p>

      <div class="plan">
        <div>
          <span class="label">DATE</span>
          <strong>16 September 2026</strong>
        </div>
        <div>
          <span class="label">TIME</span>
          <strong>6:30 PM</strong>
        </div>
        <div>
          <span class="label">PLAN</span>
          <strong>I’ll pick you up ✨</strong>
        </div>
      </div>

      <a class="btn primary" id="textBtn" href="#">
        Text me “yes” 💌
      </a>

      <p class="tiny">
        Change the phone number in <code>script.js</code> before publishing.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
